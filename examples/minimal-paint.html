<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PigmentLab · standalone engines example</title>
<style>body{margin:0;background:#253031;color:#eee;font:14px system-ui}header{height:50px;display:flex;align-items:center;gap:16px;padding:0 20px}button{padding:7px 16px}#stage{position:relative;height:calc(100dvh - 50px);overflow:hidden;touch-action:none}.sheet{position:absolute;left:50%;top:50%;transform-origin:center}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">{"imports": {"@pigmentlab/core": "../packages/core/src/index.js", "@pigmentlab/pigments": "../packages/pigments/src/index.js", "@pigmentlab/paper": "../packages/paper/src/index.js", "@pigmentlab/brushes": "../packages/brushes/src/index.js", "@pigmentlab/kernels": "../packages/kernels/src/index.js", "@pigmentlab/simulation": "../packages/simulation/src/index.js", "@pigmentlab/renderer": "../packages/renderer/src/index.js", "@pigmentlab/document": "../packages/document/src/index.js", "@pigmentlab/ui": "../packages/ui/src/index.js"}}</script></head><body>
<header><strong>PigmentLab engines</strong><button id="dry">Dry</button><button id="clear">Clear</button><input id="color" type="color" value="#538caf" aria-label="Brush color"><span id="backend"></span></header>
<div id="stage"><div id="sheet" class="sheet"><canvas id="canvas"></canvas></div></div>
<script type="module">
import { createBackend, DEFAULT_SIMULATION } from '@pigmentlab/simulation';
import { createRenderer } from '@pigmentlab/renderer';
import { Stroke, PRESETS } from '@pigmentlab/brushes';
import { Viewport, CanvasInput } from '@pigmentlab/ui';
const engine=await createBackend();engine.configure(384,256);
const surface=engine.createSurface(),canvas=document.querySelector('#canvas');
const renderer=await createRenderer(canvas,engine);renderer.resize(768,512);
const layer={id:'paint',name:'Paint',visible:true,opacity:1,blend:'normal',surface};
const view=new Viewport(document.querySelector('#stage'),document.querySelector('#sheet'),768,512);view.fit();
const point=p=>({...p,x:p.x/2,y:p.y/2});let stroke,dirty=true;
new CanvasInput(view.stage,view,{
 begin(p){stroke=new Stroke({...PRESETS[1],size:18},document.querySelector('#color').value);surface.stamp(stroke.point(point(p)));dirty=true;},
 move(p){if(stroke){surface.stamp(stroke.point(point(p)));dirty=true;}},
 end(p){if(stroke&&p)surface.stamp(stroke.point(point(p),true));stroke=null;dirty=true;}
});
document.querySelector('#backend').textContent=engine.kind;
document.querySelector('#dry').onclick=()=>{surface.operate(1);dirty=true;};
document.querySelector('#clear').onclick=()=>{surface.operate(3);dirty=true;};
window.addEventListener('resize',()=>view.fit());let last=0;
function frame(t){if(t-last>33){dirty=surface.step(1/60,DEFAULT_SIMULATION)||dirty;last=t;}if(dirty){renderer.render([layer]);dirty=false;}requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
