name: Import complete PigmentLab delivery
on:
  push:
    branches: [main]
    paths: ['.import/manifest.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pigmentlab-import
  cancel-in-progress: false
jobs:
  import:
    if: startsWith(github.event.head_commit.message, 'Bootstrap ') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore verified source files
        run: python .import/restore.py
      - name: Validate and rebuild standalone application
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --offline --no-audit --no-fund | tee artifacts/workspace-install.txt
          npm run check | tee artifacts/syntax-check.txt
          npm test | tee artifacts/unit-tests.txt
          npm run build | tee artifacts/build.txt
          node --check dist/pigmentlab.js
      - name: Rebuild standalone npm distributions and editable sample
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/packages
          npm pack --workspaces --pack-destination release/packages --json > artifacts/package-pack.json
          node examples/headless.mjs examples/Headless-study.pigment
      - name: Verify packages in an independent consumer
        shell: bash
        run: |
          set -euo pipefail
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y >/dev/null
          npm install --offline --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE"/release/packages/*.tgz
          node --input-type=module -e 'const names=["core","pigments","paper","brushes","kernels","simulation","renderer","document","ui"]; const result=[]; for(const name of names){const m=await import("@pigmentlab/"+name); if(!Object.keys(m).length) throw Error(name); result.push({name,exports:Object.keys(m)});} console.log(JSON.stringify({passed:true,packages:result},null,2));' > "$GITHUB_WORKSPACE/artifacts/package-consumer.json"
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Run studio and independent-package browser checks
        shell: bash
        run: |
          set -euo pipefail
          python tests/browser_test.py --inline | tee artifacts/browser-run.txt
          python tests/examples_test.py
      - name: Validate delivery inventory and commit all files to main
        shell: bash
        run: |
          set -euo pipefail
          python .import/finalize.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import full PigmentLab workspace, distributions, samples and verified browser artifacts'
          git push origin HEAD:main
      - name: Preserve test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pigmentlab-import-evidence
          path: |
            artifacts/
            dist/
            release/packages/
          if-no-files-found: warn
